services:
  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  frontend_node_modules:
  backend_node_modules:
  mongodb_data:
